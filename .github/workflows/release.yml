name: Release to Packagist

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Release to Packagist
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, iconv, fileinfo

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction --no-dev

    - name: Validate composer.json
      run: composer validate --strict

    - name: Create archive
      run: |
        git archive --format=tar.gz --prefix=turahe-mailclient-${{ github.ref_name }}/ HEAD > turahe-mailclient-${{ github.ref_name }}.tar.gz

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this Release
          
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for detailed changes.
          
          ## Installation
          
          ```bash
          composer require turahe/mailclient:${{ github.ref_name }}
          ```
          
          ## What's New
          
          - Fixed migration compatibility issues
          - Improved test suite coverage
          - Enhanced database schema handling
          
          ## Breaking Changes
          
          None in this release.
          
          ## Upgrade Guide
          
          Update your dependencies:
          
          ```bash
          composer update turahe/mailclient
          ```
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./turahe-mailclient-${{ github.ref_name }}.tar.gz
        asset_name: turahe-mailclient-${{ github.ref_name }}.tar.gz
        asset_content_type: application/gzip

    - name: Notify Packagist
      if: success()
      run: |
        curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
          https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}

  notify:
    name: Notify Packagist (Alternative)
    runs-on: ubuntu-latest
    needs: release
    if: always()
    
    steps:
    - name: Notify Packagist via Webhook
      if: needs.release.result == 'success'
      run: |
        curl -X POST \
          -H "Content-Type: application/json" \
          -d '{"repository":{"url":"https://github.com/${{ github.repository }}"}}' \
          https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_TOKEN }}
      env:
        PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
        PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}

    - name: Notify on Failure
      if: needs.release.result == 'failure'
      run: |
        echo "Release failed. Please check the logs and try again."
        exit 1

name: CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php: [8.4]
        laravel: [12.*]
        dependency-version: [prefer-stable]
        include:
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.dependency-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml-openssl-1.1.1, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, iconv, fileinfo
        coverage: none

    - name: Install dependencies
      run: |
        composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
        composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

    - name: Execute tests (Unit)
      run: vendor/bin/phpunit --testsuite=Unit

    - name: Execute tests (Feature)
      run: vendor/bin/phpunit --testsuite=Feature

    - name: Execute tests (with coverage)
      run: vendor/bin/phpunit --coverage-clover=coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml-openssl-1.1.1, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, iconv, fileinfo

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Run PHPStan
      run: vendor/bin/phpstan analyse --memory-limit=2G

    - name: Run PHP CS Fixer
      run: vendor/bin/php-cs-fixer fix --dry-run --diff

  security:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml-openssl-1.1.1, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, iconv, fileinfo

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Run Security Check
      run: vendor/bin/security-checker security:check composer.lock

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [test, static-analysis, security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml-openssl-1.1.1, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, iconv, fileinfo

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Build PHAR
      run: |
        composer require --dev humbug/box
        vendor/bin/box compile

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          *.phar
          build/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, static-analysis, security, build]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml-openssl-1.1.1, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, iconv, fileinfo

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release Assets
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./mail-client.phar
        asset_name: mail-client.phar
        asset_content_type: application/octet-stream

  publish:
    name: Publish to Packagist
    runs-on: ubuntu-latest
    needs: [test, static-analysis, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: dom, curl, libxml-openssl-1.1.1, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, gd, iconv, fileinfo

    - name: Install dependencies
      run: composer install --prefer-dist --no-interaction

    - name: Validate composer.json
      run: composer validate --strict

    - name: Publish to Packagist
      run: |
        composer config http-basic.repo.packagist.com token ${{ secrets.PACKAGIST_TOKEN }}
        composer publish --no-interaction
      env:
        PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }} 